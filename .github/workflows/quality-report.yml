# Report-only checks for the client (issue #346, wave 6). Nothing here can fail a pull request:
# each tool's findings are written to the job's summary page (and echoed into the log with tee, so
# a terminal can read them) and the job always ends green. Wave 7 (#347) reads these reports and
# decides which checks earned the right to block. The server has the same arrangement in its own
# quality-report.yml, and the same rule for a crashed tool: it must say so.
#
# WHAT IS NOT HERE: the game build. scripts/build.ps1 needs the AIR SDK and the decompiled game
# (_decompiled/), neither of which exists on a GitHub runner, so the build and the pre-commit
# compile check stay local. Nothing under tests/ runs here either: those tests drive the real game.
#
# A CHECK THAT CRASHED MUST NOT LOOK LIKE A CHECK THAT FOUND NOTHING. Each section below says
# "TOOL DID NOT RUN" when its tool crashed or examined nothing.
#
# Both checks look at the whole repository, not only the changed files, so the same baseline shows
# on every pull request and a change that adds a problem shows as a change in the count.

name: quality-report
on: pull_request

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung tool would otherwise run to the six-hour default

    steps:
      - uses: actions/checkout@v6

      # Links that leave this repository are the "[local]" half of a dual link: they point into the
      # parent BSF checkout, which does not exist when this repo is checked out on its own. The
      # "[GitHub]" half of each is what a reader on github.com follows. The runner folder is
      # <parent>/<repo>, so "leaves the repo" means: anywhere under <parent> but outside <repo>.
      # lychee has no "not this folder" pattern, so the checks below exclude everything under
      # <parent> and then include <repo> again (an include beats every exclude).
      - name: Work out the folder above the checkout
        run: echo "PARENT_DIR=$(dirname "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"

      - name: Document links - do the linked files exist
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: false # report only
          failIfEmpty: false # an empty result is reported below, as a tool that did not run
          jobSummary: false # the next step writes the summary, in the same style as the others
          # The reports go to the runner's temp folder, not into the checkout: inside it, the
          # second check would scan the first one's report as if it were a document.
          output: ${{ runner.temp }}/lychee-links.md
          # --offline: local files only, so no network failures and no rate limits.
          # Web addresses are skipped, which includes the [GitHub] half of every dual link.
          args: >-
            --offline --no-progress
            --exclude '^file://${{ env.PARENT_DIR }}/'
            --include '^file://${{ github.workspace }}/'
            '**/*.md'

      - name: Document links - summary
        if: always()
        env:
          LYCHEE_EXIT: ${{ steps.links.outputs.exit_code }}
        run: |
          {
            echo "### Document links (report only, nothing blocks)"
            report="$RUNNER_TEMP/lychee-links.md"
            # lychee exits 0 when every link resolved, 2 when some did not. Anything else, or no
            # report at all, means the tool itself failed.
            if [ -z "${LYCHEE_EXIT:-}" ] || { [ "$LYCHEE_EXIT" != 0 ] && [ "$LYCHEE_EXIT" != 2 ]; } || [ ! -s "$report" ]; then
              echo "**TOOL DID NOT RUN** (exit code ${LYCHEE_EXIT:-none})."
            elif grep -qE 'Total\s+\|\s+0\b' "$report"; then
              echo "**TOOL DID NOT RUN** (it examined no links)."
            else
              # The report ends with a link to this very run; drop it.
              grep -v '^\[Full Github Actions output\]' "$report"
            fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # Heading anchors ("file.md#section") are reported on their own so that the file check above
      # keeps a clean meaning. Whether to check them at all is decided from the first real run.
      - name: Document links - heading anchors
        id: anchors
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: false
          failIfEmpty: false
          jobSummary: false
          output: ${{ runner.temp }}/lychee-anchors.md
          args: >-
            --offline --no-progress --include-fragments
            --exclude '^file://${{ env.PARENT_DIR }}/'
            --include '^file://${{ github.workspace }}/'
            '**/*.md'

      - name: Document links - anchors summary
        if: always()
        env:
          LYCHEE_EXIT: ${{ steps.anchors.outputs.exit_code }}
        run: |
          {
            echo "### Heading anchors (report only, nothing blocks)"
            report="$RUNNER_TEMP/lychee-anchors.md"
            if [ -z "${LYCHEE_EXIT:-}" ] || { [ "$LYCHEE_EXIT" != 0 ] && [ "$LYCHEE_EXIT" != 2 ]; } || [ ! -s "$report" ]; then
              echo "**TOOL DID NOT RUN** (exit code ${LYCHEE_EXIT:-none})."
            elif grep -qE 'Total\s+\|\s+0\b' "$report"; then
              echo "**TOOL DID NOT RUN** (it examined no links)."
            else
              echo "This run also checks that each #section a link names exists. Problems that appear here but not above are anchors."
              echo
              grep -v '^\[Full Github Actions output\]' "$report"
            fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: PSScriptAnalyzer - PowerShell scripts
        continue-on-error: true
        shell: pwsh
        run: |
          $version = '1.25.0'
          $out = [System.Collections.Generic.List[string]]::new()
          $out.Add('### Script lint (PSScriptAnalyzer, errors and warnings only, nothing blocks)')
          try {
            if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq [version]$version })) {
              Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force -ErrorAction Stop
            }
            Import-Module -Name PSScriptAnalyzer -RequiredVersion $version -ErrorAction Stop

            # Tracked files only, so a downloaded or generated script is never examined.
            $files = @(git ls-files '*.ps1' '*.psm1')
            if ($files.Count -eq 0) { throw 'no PowerShell files were found' }

            $findings = foreach ($f in $files) {
              Invoke-ScriptAnalyzer -Path $f -Settings ./PSScriptAnalyzerSettings.psd1
            }
            $findings = @($findings)
            $unparsed = @($findings | Where-Object { $_.Severity -eq 'ParseError' })
            $real = @($findings | Where-Object { $_.Severity -ne 'ParseError' })

            $out.Add("$($files.Count) files examined, $($real.Count) findings.")
            if ($unparsed.Count -gt 0) {
              $out.Add('')
              $out.Add("**$($unparsed.Count) file(s) could not be parsed, so the linter did not check them.**")
            }
            if ($real.Count -gt 0) {
              $out.Add('')
              $out.Add('| Rule | Findings |')
              $out.Add('|---|---|')
              $real | Group-Object RuleName | Sort-Object Count -Descending | ForEach-Object {
                $out.Add("| $($_.Name) | $($_.Count) |")
              }
              $out.Add('')
              $out.Add('Ten files with the most findings:')
              $out.Add('')
              $real | Group-Object ScriptPath | Sort-Object Count -Descending | Select-Object -First 10 | ForEach-Object {
                $rel = [System.IO.Path]::GetRelativePath($PWD.Path, $_.Name) -replace '\\', '/'
                $out.Add("- ``$rel``: $($_.Count)")
              }
            }
          } catch {
            $out.Add("**TOOL DID NOT RUN** ($($_.Exception.Message)).")
          }
          $out.Add('')
          $out | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit 0
